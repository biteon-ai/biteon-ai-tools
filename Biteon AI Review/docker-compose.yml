services:
  ollama:
    image: ollama/ollama:latest
    container_name: qwen-ollama
    restart: unless-stopped
    volumes:
      - ollama-data:/root/.ollama
    ports:
      - "127.0.0.1:11435:11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 10s

  model-init:
    image: ollama/ollama:latest
    container_name: qwen-model-init
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
      BASE_MODEL: ${BASE_MODEL:-qwen2.5-coder:32b-instruct-q4_K_M}
    volumes:
      - ./ollama/Modelfile:/Modelfile:ro
      - ./ollama/init-model.sh:/init-model.sh:ro
    entrypoint: ["/bin/sh", "/init-model.sh"]
    restart: "no"

  qwen-ui:
    build: .
    container_name: qwen-ui
    restart: unless-stopped
    depends_on:
      model-init:
        condition: service_completed_successfully
    environment:
      OLLAMA_BASE: http://ollama:11434/v1
      OLLAMA_ROOT: http://ollama:11434
      MODEL: qwen:security-audit
      HOME_ROOT: /data/home
      HOME_DISPLAY: /home
      BIND_HOST: 0.0.0.0
      BIND_PORT: "8787"
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - /home:/data/home
      - ./skills:/skills/bundled:ro
      - ./skills-extra:/skills/extra

volumes:
  ollama-data:
