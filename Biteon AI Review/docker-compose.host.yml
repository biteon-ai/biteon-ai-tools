services:
  qwen-ui:
    build: .
    container_name: qwen-ui
    network_mode: host
    restart: unless-stopped
    environment:
      OLLAMA_BASE: http://127.0.0.1:11434/v1
      OLLAMA_ROOT: http://127.0.0.1:11434
      MODEL: qwen:security-audit
      HOME_ROOT: /data/home
      HOME_DISPLAY: /home
      BIND_HOST: 127.0.0.1
      BIND_PORT: "8787"
    volumes:
      - /home:/data/home
      - ./skills:/skills/bundled:ro
      - ./skills-extra:/skills/extra
